<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>RubberTrade Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    body { margin: 0; padding: 0; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      color: white;
      padding: 10px 24px;
      font-size: 14px;
    }
    .top-nav a {
      color: #9ca3af;
      text-decoration: none;
      margin-left: 16px;
    }
    .top-nav a:hover {
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <div style="font-weight: bold; color: #10b981;">🌱 RubberTrade Swagger UI</div>
    <div>
      <a href="/api-docs/">✨ Modern API Reference (Scalar)</a>
      <a href="/openapi.json" target="_blank">📥 raw openapi.json</a>
      <a href="/dashboard">🏠 Dashboard</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
