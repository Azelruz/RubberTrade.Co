<!doctype html>
<html lang="th">
  <head>
    <title>RubberTrade API Reference & Documentation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --scalar-font: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .docs-header-bar {
        position: sticky;
        top: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #0f172a;
        color: #ffffff;
        padding: 8px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .docs-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        color: #10b981;
      }
      .docs-links {
        display: flex;
        gap: 16px;
      }
      .docs-links a {
        color: #94a3b8;
        text-decoration: none;
        transition: color 0.2s;
      }
      .docs-links a:hover {
        color: #ffffff;
      }
      .badge-branch {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 11px;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0;">
    <div class="docs-header-bar">
      <div class="docs-brand">
        <span>🌱 RubberTrade Co., Ltd.</span>
        <span class="badge-branch">v1.8.2 OpenAPI 3.0</span>
      </div>
      <div class="docs-links">
        <a href="/openapi.json" target="_blank" download>📥 ดาวน์โหลด OpenAPI JSON</a>
        <a href="/swagger.html">📋 Swagger UI</a>
        <a href="/dashboard">🏠 กลับหน้าแดชบอร์ด</a>
      </div>
    </div>

    <!-- Scalar API Reference -->
    <script
      id="api-reference"
      data-url="/openapi.json"
      data-configuration='{
        "theme": "kepler",
        "layout": "modern",
        "showSidebar": true,
        "searchHotKey": "k",
        "metaData": {
          "title": "RubberTrade API Documentation"
        },
        "defaultHttpClient": {
          "targetKey": "javascript",
          "clientKey": "fetch"
        }
      }'
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  </body>
</html>
